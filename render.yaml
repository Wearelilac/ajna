services:
  - type: web
    name: ajna-api
    runtime: node
    region: oregon
    plan: standard
    buildCommand: cd apps/api && npm install && npm run build
    startCommand: cd apps/api && npm start
    envVars:
      - key: AJNA_ENV
        value: production
      - key: NODE_ENV
        value: production
      - key: AJNA_PORT
        value: 3000
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: ajna-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: ajna-redis
          type: redis
          property: connectionString
      - key: AJNA_KEK_BASE64
        sync: false
      - key: AJNA_JWT_SECRET
        sync: false
      - key: AJNA_SCORING_URL
        value: https://ajna-scoring.onrender.com
      - key: AJNA_SCORING_TOKEN
        sync: false

databases:
  - name: ajna-db
    plan: standard
    postgresMajorVersion: '16'
    region: oregon

redisInstances:
  - name: ajna-redis
    plan: standard
    region: oregon
